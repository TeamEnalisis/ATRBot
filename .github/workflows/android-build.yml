name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # AGP 8.2.2 (used in this project) is NOT compatible with the
      # runner's default system Gradle (9.x) -- that mismatch caused the
      # earlier "Cannot mutate the dependencies of configuration
      # ':app:debugCompileClasspath'" failure, and also broke the
      # "gradle wrapper" workaround since generating the wrapper still
      # configures the project under the incompatible version.
      # Fix: tell setup-gradle to install and use Gradle 8.4 directly.
      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpsharma-tradingbot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to a release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
